# Apache vhost for Vass Organic — ready to paste into WHM.
#
# WHM → Apache Configuration → Include Editor → Post VirtualHost Include →
# All Versions → paste → Update → restart Apache.
#
# Ports here are the HOST-side ports from docker-compose.yml (3031 frontend,
# 4041 backend), NOT the container-side ones. If you change them in compose,
# change them here too.
#
# This must not collide with the existing vass.petaronline.us vhost — it is a
# different ServerName and different ports, so both can be present at once.

<VirtualHost *:80>
    ServerName organic.petaronline.us

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName organic.petaronline.us

    # SSL — WHM AutoSSL fills these in once DNS resolves and you run
    # "Manage AutoSSL → Run AutoSSL For All Users". Paths may differ.
    SSLEngine on
    SSLCertificateFile      /var/cpanel/ssl/apache_tls/organic.petaronline.us/combined
    SSLCertificateKeyFile   /var/cpanel/ssl/apache_tls/organic.petaronline.us/combined

    ProxyPreserveHost On
    ProxyRequests Off

    # /api/* → backend, with the /api prefix stripped by the trailing slash
    ProxyPass        /api/ http://127.0.0.1:4041/
    ProxyPassReverse /api/ http://127.0.0.1:4041/

    # Everything else → Next.js frontend
    ProxyPass        / http://127.0.0.1:3031/
    ProxyPassReverse / http://127.0.0.1:3031/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "organic.petaronline.us"

    # Video and PDF uploads are large; don't let the proxy time out mid-publish.
    ProxyTimeout 300

    # WebSocket upgrade (Next.js dev tools — harmless in production)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3031/$1" [P,L]
</VirtualHost>
