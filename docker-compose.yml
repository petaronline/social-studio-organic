# ====================================================================
# Vass Organic — docker-compose orchestration
#
# One command brings the whole stack up:
#
#   docker compose up -d
#
# Services:
#   - postgres   (database)
#   - redis      (queue + cache)
#   - backend    (API + publish/sync worker, both in one container)
#   - frontend   (Next.js static + SSR)
#
# ---- Designed to run ALONGSIDE the ads app (Vass) on the same host ----
#
# Everything that could collide with a Vass install has been renamed or
# moved: the compose project name, all four container names, all three
# volume names, and every host-side port. If you run both stacks on one
# box, `docker compose ls` should show `vass` and `vass-organic` as two
# independent projects sharing nothing.
#
#   component   Vass (ads)   Vass Organic
#   ---------   ----------   ------------
#   postgres    5432         5433
#   redis       6379         6380
#   backend     4040         4041
#   frontend    3030         3031
#
# Bound to 127.0.0.1 only. A reverse proxy (Apache, nginx, Caddy, cPanel)
# in front terminates TLS and forwards to:
#   - host port 3031 → frontend
#   - host port 4041 → backend  (paths starting with /api/* should be
#                                rewritten by the reverse proxy to strip
#                                the /api prefix before forwarding here)
#
# Change the host-side ports here if these are taken on your server.
# The container-side ports (3000/4000) should NOT be changed.
# ====================================================================

name: vass-organic

services:
  postgres:
    image: postgres:16-alpine
    container_name: vass-organic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vassorganic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vassorganic}
    volumes:
      - organic_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vassorganic}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vass-organic-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - organic_redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vass-organic-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vassorganic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vassorganic}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOAD_ROOT: /uploads
    volumes:
      - organic_uploads:/uploads
    ports:
      - "127.0.0.1:4041:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: vass-organic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3031:3000"

volumes:
  organic_postgres_data:
  organic_redis_data:
  organic_uploads:
