# ====================================================================
# Vass Organic — docker-compose orchestration
#
# One command brings the whole stack up:
#
#   docker compose up -d
#
# Services:
#   - postgres   (database)
#   - redis      (queue + cache)
#   - backend    (API + publish/sync worker, both in one container)
#   - frontend   (Next.js static + SSR)
#
# ---- HOST NETWORKING, NOT PORT PUBLISHING ----
#
# Every service uses `network_mode: host` and binds its host port directly.
# This mirrors the ads app's live compose on the same server, and it is not a
# style choice: published ports on the bridge network did not work on this box
# for the two Node services (the ports listened but every connection was reset),
# while the ads stack has run reliably on host networking for months. Do not
# "clean this up" back to `ports:` without testing on the real server.
#
# Consequences to keep in mind:
#   • There is no container-to-container DNS. Services address each other on
#     127.0.0.1, so DATABASE_URL/REDIS_URL below use explicit host ports.
#   • Ports are claimed on the host directly, so they must not collide with
#     the ads app. They don't — see the table.
#
# ---- Designed to run ALONGSIDE the ads app (Vass) on the same host ----
#
#   component   Vass (ads)   Vass Organic
#   ---------   ----------   ------------
#   postgres    5432         5433
#   redis       6379         6380
#   backend     4040         4041
#   frontend    3030         3031
#
# A reverse proxy (Apache, via the cPanel userdata include installed by
# scripts/go-live.sh) terminates TLS and forwards:
#   - https://organic.petaronline.us/      → 127.0.0.1:3031
#   - https://organic.petaronline.us/api/* → 127.0.0.1:4041 (/api stripped)
# ====================================================================

name: vass-organic

services:
  postgres:
    image: postgres:16-alpine
    container_name: vass-organic-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vassorganic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vassorganic}
      # Host networking means we share the host's port space with the ads
      # app's postgres on 5432 — so ours must listen elsewhere.
      PGPORT: 5433
    volumes:
      - organic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vassorganic} -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vass-organic-redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --port 6380 --save 60 1 --loglevel warning
    volumes:
      - organic_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vass-organic-backend
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Overrides the Dockerfile's EXPOSE 4000 — with host networking the
      # app binds this port on the host itself.
      PORT: 4041
      DATABASE_URL: postgresql://${POSTGRES_USER:-vassorganic}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB:-vassorganic}
      REDIS_URL: redis://127.0.0.1:6380
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOAD_ROOT: /uploads
    volumes:
      - organic_uploads:/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: vass-organic-frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3031
      # Next's standalone server binds process.env.HOSTNAME. Docker sets
      # HOSTNAME to the container id by default, which the server cannot
      # bind — pin it explicitly, exactly as the ads app does.
      HOSTNAME: 127.0.0.1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

  # Self-hosted speech-to-text (faster-whisper, CPU). Free. Transcribes meeting
  # recordings. The model downloads on first run into the cache volume (first
  # transcription is slow while it fetches; fast after). Binds host port 9000.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: vass-organic-whisper
    restart: unless-stopped
    network_mode: host
    environment:
      ASR_ENGINE: faster_whisper
      # small = good multilingual (Serbian + English) balance on CPU. The box
      # has plenty of RAM to go bigger (medium/large-v3) by changing this.
      ASR_MODEL: small
    volumes:
      - organic_whisper_cache:/root/.cache

  # Self-hosted LLM (Ollama, CPU) for meeting summaries. Free, and OPTIONAL: if
  # it isn't running or the model isn't pulled, transcription still works and
  # the summary step is skipped. Pull the model once after first deploy:
  #   docker exec vass-organic-ollama ollama pull qwen2.5:7b-instruct
  # Binds host port 11434.
  ollama:
    image: ollama/ollama:latest
    container_name: vass-organic-ollama
    restart: unless-stopped
    network_mode: host
    volumes:
      - organic_ollama:/root/.ollama

volumes:
  organic_postgres_data:
  organic_redis_data:
  organic_uploads:
  organic_whisper_cache:
  organic_ollama:
